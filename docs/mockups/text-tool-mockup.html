<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Tool Mockup</title>
  <style>
    :root{--bg:#1f1f1e;--top:var(--panel-solid);--panel:var(--panel-solid);--panel2:var(--row);--surface:#262626;--line:rgba(242,242,242,.08);--txt:#f2f2f2;--txt2:#5a5956;--accent:#5aa6f2;--shadow:0 2px 5px rgba(0,0,0,.4);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;overflow:hidden;color:var(--txt);background:var(--bg)}
    .app{display:grid;grid-template-columns:58px 1fr 250px;grid-template-rows:54px 1fr;min-height:100vh}
    .topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--top);border-bottom:1px solid #1c1d20}
    .mark{display:grid;place-items:center;width:26px;height:26px;border-radius:4px;color:#8fd3ff;background:#091623;font-weight:800;font-size:14px}
    .menu{display:flex;gap:18px;color:#e3e3e3;font-size:17px}.options{margin-left:24px;display:flex;gap:8px;padding-left:18px;border-left:1px solid #222}
    .chip{display:flex;align-items:center;min-height:30px;padding:0 9px;border:1px solid transparent;border-radius:5px;color:var(--txt2);font-size:13px}.chip.on{color:var(--txt);border-color:#6ea3d4;background:rgba(79,143,186,.22)}
    .toolbar{grid-row:2;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px;background:#56585c;border-right:2px solid #25262a}
    .tool{display:grid;place-items:center;width:42px;height:42px;border:1px solid transparent;border-radius:4px;color:#f1f1f1;background:transparent;font-size:22px;font-weight:800}.tool.active{border-color:#7a7f88;background:#4a4d52;box-shadow:inset 0 0 0 1px rgba(0,0,0,.24)}
    .work{position:relative;grid-column:2;grid-row:2;background:#242527;overflow:hidden}.tab{height:40px;display:flex;align-items:center;padding:0 16px;background:#53555a;border-bottom:1px solid #292b2f;font-weight:800}
    .canvas{position:absolute;left:120px;top:108px;width:360px;height:260px;border:1px solid #15161a;box-shadow:0 8px 24px rgba(0,0,0,.28);background:linear-gradient(45deg,#2d2f33 25%,transparent 25%),linear-gradient(-45deg,#2d2f33 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#2d2f33 75%),linear-gradient(-45deg,transparent 75%,#2d2f33 75%),#373a40;background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
    .text-box{position:absolute;left:48px;top:72px;min-width:190px;min-height:62px;padding:8px 10px;border:1px solid var(--accent);color:#f7df9b;font:28px Georgia,serif;line-height:1.05;text-shadow:2px 0 #341c27,-2px 0 #341c27,0 2px #341c27,0 -2px #341c27}
    .text-box:after{content:"";position:absolute;right:-5px;bottom:-5px;width:9px;height:9px;background:var(--accent);border:1px solid #dbeaff}.selected{color:#fff;background:rgba(79,143,186,.64)}.caret{display:inline-block;width:2px;height:.9em;margin-left:2px;vertical-align:-2px;background:#fff}
    .side{grid-column:3;grid-row:2;padding:12px;background:#2d2f33;border-left:1px solid #17181b}.layer{height:54px;border:1px solid var(--accent);border-radius:5px;background:#42464d;display:flex;align-items:center;gap:10px;padding:8px}.layer-i{display:grid;place-items:center;width:34px;height:34px;border-radius:4px;background:#202226;color:#f7df9b;font-weight:800}
    .panel{position:absolute;right:278px;top:88px;width:344px;height:432px;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}.head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;border-bottom:1px solid var(--line);font-weight:800;cursor:grab}.ha{display:flex;gap:6px}
    .btn{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:var(--txt2);background:var(--row);font-size:14px}.body{padding:8px}.tiles{display:grid;grid-template-columns:repeat(4,minmax(64px,1fr));gap:8px;max-height:260px;overflow-y:auto;padding-right:2px}
    .ft{min-width:0;border-radius:12px;background:var(--panel2);color:var(--txt2);overflow:hidden}.ft.on{background:var(--accent);color:var(--txt)}.pv{display:grid;place-items:center;aspect-ratio:1;color:var(--txt);background:var(--surface);font-size:28px;line-height:1}.nm{height:26px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bottom{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.size-row{display:grid;grid-template-columns:auto 1fr 48px 34px;gap:8px;align-items:center;color:var(--txt2);font-size:13px}.size-v{color:var(--txt);font-weight:800;text-align:right}
    .slider{position:relative;height:22px;border-radius:999px;background:rgba(90,89,86,.5)}.slider:before{content:"";position:absolute;inset:9px 42% 9px 0;border-radius:inherit;background:var(--accent)}.slider:after{content:"";position:absolute;left:55%;top:50%;width:22px;height:22px;border-radius:50%;transform:translateY(-50%);background:#fff}
    .sw{width:34px;height:34px;border-radius:50%;border:2px solid #d8d8d8;background:#f7df9b;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}
    .rsz{position:absolute;right:4px;bottom:4px;color:var(--txt2)}
    @media(max-width:860px){.app{grid-template-columns:52px 1fr}.side{display:none}.panel{left:70px;right:12px;width:auto}.canvas{left:82px;width:280px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="mark">PH</div><nav class="menu" aria-label="App menu"><span>Файл</span><span>Редактирование</span><span>Вид</span></nav>
      <div class="options"><div class="chip on">T Text</div><div class="chip">Stroke 2 px</div><div class="chip">Aa</div></div>
    </header>
    <aside class="toolbar" aria-label="Toolbar">
      <div class="tool">✥</div><div class="tool">□</div><div class="tool">◌</div><div class="tool">⌖</div>
      <div class="tool active">T</div><div class="tool">✎</div><div class="tool">▰</div><div class="tool">☰</div>
    </aside>
    <section class="work">
      <div class="tab">Ui_yokai.psd @ 200%</div>
      <div class="canvas"><div class="text-box">Pixel<br><span class="selected">Heart</span><span class="caret"></span></div></div>
      <section class="panel" aria-label="Font panel">
        <div class="head"><span>Шрифты</span><div class="ha"><div class="btn">+</div><div class="btn">↕</div><div class="btn">×</div></div></div>
        <div class="body">
          <div class="tiles">
            <div class="ft on"><div class="pv" style="font-family:Georgia,serif">Aa</div><div class="nm">Yokai Serif</div></div>
            <div class="ft"><div class="pv" style="font-family:'Courier New',monospace">Aa</div><div class="nm">Pixel Mono</div></div>
            <div class="ft"><div class="pv" style="font-family:Impact,sans-serif">Aa</div><div class="nm">Block</div></div>
            <div class="ft"><div class="pv" style="font-family:Verdana,sans-serif">Aa</div><div class="nm">Soft UI</div></div>
            <div class="ft"><div class="pv" style="font-family:Garamond,serif">Aa</div><div class="nm">Rename</div></div>
            <div class="ft"><div class="pv" style="font-family:'Trebuchet MS',sans-serif">Aa</div><div class="nm">Imported</div></div>
            <div class="ft"><div class="pv" style="font-family:Arial Black,sans-serif">Aa</div><div class="nm">Title</div></div>
            <div class="ft"><div class="pv">+</div><div class="nm">Import</div></div>
            <div class="ft"><div class="pv" style="font-family:Arial,sans-serif">Aa</div><div class="nm">Caption</div></div>
            <div class="ft"><div class="pv" style="font-family:Tahoma,sans-serif">Aa</div><div class="nm">UI Small</div></div>
            <div class="ft"><div class="pv" style="font-family:Times New Roman,serif">Aa</div><div class="nm">Book</div></div>
            <div class="ft"><div class="pv" style="font-family:Consolas,monospace">Aa</div><div class="nm">Console</div></div>
          </div>
          <div class="bottom">
            <div class="size-row"><span>Size</span><div class="slider" aria-hidden="true"></div><strong class="size-v">28 px</strong><div class="sw" title="Text color"></div></div>
          </div>
        </div>
        <div class="rsz">⌟</div>
      </section>
    </section>
    <aside class="side"><div class="layer"><div class="layer-i">T</div><div><strong>Pixel Heart</strong><br><span style="color:var(--txt2);font-size:12px">Text layer</span></div></div></aside>
  </main>
</body>
</html>
