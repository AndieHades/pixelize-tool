<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Pixel Heart</title>
  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/app.css" />
  <link rel="stylesheet" href="src/styles/animations.css" />
</head>
<body>
  <canvas id="cv"></canvas>

  <header id="topbar">
    <div class="tb-group" id="tb-left">
      <button id="docsbtn" data-i18n-title="tool.gallery"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
      <button id="imp-btn" data-i18n-title="tool.importMenu"><svg viewBox="0 0 24 24"><rect x="3.5" y="11" width="17" height="9" rx="2.5"/><path d="M12 3v8.5"/><path d="M8.5 8L12 11.5 15.5 8"/></svg></button>
      <button id="export-btn" data-i18n-title="tool.exportMenu"><svg viewBox="0 0 24 24"><rect x="3.5" y="11" width="17" height="9" rx="2.5"/><path d="M12 11.5V3"/><path d="M8.5 6.5L12 3 15.5 6.5"/></svg></button>
      <div class="tb-sep" id="tb-sep-l"></div>
      <button id="prev" data-i18n-title="tool.preview"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><rect x="12.5" y="11.5" width="5" height="4.5" rx="1" fill="currentColor" stroke="none"/></svg></button>
      <button id="refbtn" data-i18n-title="tool.reference"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M3.5 8h17"/><circle cx="9" cy="13" r="1.4" fill="currentColor" stroke="none"/><path d="M5.5 19l4-4 2.6 2.6 2.2-2.2 4.2 3.6"/></svg></button>
      <button id="fit" data-i18n-title="tool.fit"><svg viewBox="0 0 24 24"><path d="M9 4.5H7A2.5 2.5 0 0 0 4.5 7v2M15 4.5h2A2.5 2.5 0 0 1 19.5 7v2M9 19.5H7A2.5 2.5 0 0 1 4.5 17v-2M15 19.5h2a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg></button>
      <button id="zin" data-i18n-title="tool.zoomIn"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      <button id="zout" data-i18n-title="tool.zoomOut"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    </div>
    <div class="tb-group" id="tb-right">
      <button id="t-pencil" class="on" data-i18n-title="tool.pencil"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l.9-3.6L16.6 4.7a2.05 2.05 0 0 1 2.9 2.9L8.3 18.8l-3.8.7z"/><path d="M14.7 6.6l2.9 2.9"/></svg></button>
      <button id="t-eraser" data-i18n-title="tool.eraser"><svg viewBox="0 0 24 24"><path d="M8.7 18.7H6.3L4 16.4a1.9 1.9 0 0 1 0-2.7l8.6-8.6a1.9 1.9 0 0 1 2.7 0l4 4a1.9 1.9 0 0 1 0 2.7l-7 6.9z"/><path d="M9.3 8.3l6.4 6.4"/><path d="M12.5 20.5H20"/></svg></button>
      <button id="t-fill" data-i18n-title="tool.fill"><svg viewBox="0 0 24 24"><path d="M11.3 3.8l7 7-6.2 6.2a1.9 1.9 0 0 1-2.7 0l-4.3-4.3a1.9 1.9 0 0 1 0-2.7l6.2-6.2z"/><path d="M4.6 12.5h12.2"/><path d="M19.9 14.6s1.6 2 1.6 3.1a1.6 1.6 0 0 1-3.2 0c0-1.1 1.6-3.1 1.6-3.1z"/></svg></button>
      <button id="t-line" data-i18n-title="tool.line"><svg viewBox="0 0 24 24"><path d="M5.5 18.5L18.5 5.5"/><circle cx="5.5" cy="18.5" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.5" cy="5.5" r="1.7" fill="currentColor" stroke="none"/></svg></button>
      <button id="t-shape" data-i18n-title="tool.rect"><svg viewBox="0 0 24 24"><rect x="4.5" y="6.5" width="15" height="11" rx="1.5"/></svg></button>
      <button id="t-move" data-i18n-title="tool.move"><svg viewBox="0 0 24 24"><path d="M5 2.5l13.5 7.9-5.8 1.4-2.9 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
      <button id="t-adjust" data-i18n-title="tool.adjust"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor" stroke="none"/><path d="M12 6.5v11"/></svg></button>
      <button id="t-select" data-i18n-title="tool.select"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="2.5" stroke-dasharray="3.5 3"/></svg></button>
      <button id="t-lasso" data-i18n-title="tool.lasso"><svg viewBox="0 0 24 24"><path d="M4 13c0-5 4-8.5 8.5-8.5S20 7.5 20 11.5c0 3-2.5 4.5-4.5 4.5-1.5 0-2.5-1-2.5-2s.8-1.8 1.8-1.8" stroke-dasharray="3 2.6"/><path d="M9 18.5a2 2 0 1 1-2.6-1.9" stroke-dasharray="2.6 2.4"/></svg></button>
      <div class="tb-sep" id="tb-sep1"></div>
      <button id="layers" data-i18n-title="tool.layers"><svg viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.5L12 12.5 3.5 8 12 3.5z"/><path d="M4.5 12.5L12 16.5l7.5-4"/><path d="M4.5 16.5L12 20.5l7.5-4"/></svg></button>
      <button id="activewrap" data-i18n-title="tool.color"><span id="active"></span></button>
    </div>
  </header>

  <aside id="sidebar">
    <div id="sb-grip" data-i18n-title="ui.dragPanel"></div>
    <button id="sym" data-i18n-title="side.symmetry"><svg viewBox="0 0 24 24"><path d="M12 4v16" stroke-dasharray="3 3"/><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/></svg></button>
    <button id="grid-btn" data-i18n-title="side.grid"><svg viewBox="0 0 24 24"><path d="M4.5 8.5h15M4.5 15.5h15M8.5 4.5v15M15.5 4.5v15"/><rect x="4.5" y="4.5" width="15" height="15" rx="2"/></svg></button>
    <button id="tile-btn" data-i18n-title="side.tile"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="6" height="6" rx="1" fill="currentColor" stroke="none"/><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="17" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="17" width="4.5" height="4.5" rx="1"/><rect x="17" y="17" width="4.5" height="4.5" rx="1"/></svg></button>
    <button id="pp" class="on" data-i18n-title="side.pp"><svg viewBox="0 0 24 24"><path d="M4 20v-5h5v-5h5V5h6"/></svg></button>
    <button id="stab" class="on" data-i18n-title="side.stab"><svg viewBox="0 0 24 24"><path d="M3.5 15.5c3-6.5 5-6.5 8.5-3.5s5.5 3 8.5-3.5"/></svg></button>
    <button id="flip-h" data-i18n-title="side.flipH"><svg viewBox="0 0 24 24"><path d="M12 4v16" stroke-dasharray="2 2"/><path d="M8 7.5v9L3.8 12 8 7.5z" fill="currentColor" stroke="none"/><path d="M16 7.5v9l4.2-4.5L16 7.5z" fill="currentColor" stroke="none"/></svg></button>
    <button id="rot" data-i18n-title="side.rotate"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-7-7"/><path d="M9.8 2.6L12.4 5l-2.6 2.4"/></svg></button>
    <button id="crop" data-i18n-title="side.crop"><svg viewBox="0 0 24 24"><path d="M6 2.5V18h15.5"/><path d="M2.5 6H18v15.5"/></svg></button>
    <button id="trim" data-i18n-title="side.trim"><svg viewBox="0 0 24 24"><rect x="7.5" y="7.5" width="9" height="9" rx="1"/><path d="M4 7.5V4.5h3M20 7.5V4.5h-3M4 16.5v3h3M20 16.5v3h-3"/></svg></button>
    <button id="center" data-i18n-title="side.center"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3"/></svg></button>
    <div id="sb-rsz" data-i18n-title="ui.resizePanel"><svg viewBox="0 0 24 24"><path d="M19 13l-6 6M19 17.5L16.5 20"/></svg></div>
  </aside>

  <div id="tctx">
    <button id="tctx-hide" data-i18n="tctx.hide"></button>
    <button id="tctx-conf" data-i18n="tctx.conf"></button>
  </div>
  <div id="line-choice" class="tool-choice"></div>
  <div id="brush-choice" class="tool-choice"></div>
  <div id="shape-choice" class="tool-choice"></div>
  <div id="sym-choice" class="tool-choice"></div>
  <div id="flip-choice" class="tool-choice"></div>

  <div id="grid-pop" class="toolpop">
    <div class="bp-head"><span class="bp-title" data-i18n="grid.title"></span><button class="win-x" data-i18n-title="btn.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="grid-dims">
      <div class="irow grid-size"><label data-i18n="label.width"></label><input id="grid-w" type="text" inputmode="text" spellcheck="false" /><b>px</b></div>
      <button id="grid-link" class="se-link" data-i18n-title="new.lockRatio"><svg viewBox="0 0 24 24"><path d="M9.5 8H8a4 4 0 0 0 0 8h1.5"/><path d="M14.5 8H16a4 4 0 0 1 0 8h-1.5"/><path d="M8.5 12h7"/></svg></button>
      <div class="irow grid-size"><label data-i18n="label.height"></label><input id="grid-h" type="text" inputmode="text" spellcheck="false" /><b>px</b></div>
    </div>
    <div class="irow"><label data-i18n="label.opacity"></label><input id="grid-op" type="range" min="5" max="100" step="5" value="70" /><b id="grid-opv">70%</b></div>
    <div class="irow"><label data-i18n="label.color"></label><button id="grid-color" class="fx-colbtn"></button></div>
    <div class="iact"><button id="grid-cancel" data-i18n="btn.cancel" class="txtbtn"></button><button id="grid-apply" data-i18n="btn.apply" class="txtbtn primary"></button></div>
  </div>

  <div id="tools-ovl" class="ovl"><div class="sheet">
    <h3 data-i18n="dialog.panels"></h3>
    <p class="hint" style="margin:0 2px" data-i18n="hint.panels"></p>
    <div id="tools-list"></div>
    <div class="iact"><button id="tools-reset" class="txtbtn" data-i18n="btn.resetPanels"></button><button id="tools-close" data-i18n="btn.done" class="txtbtn primary"></button></div>
  </div></div>

  <div id="cropbar">
    <button id="crop-sym" data-i18n-title="crop.center"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22"/></svg></button>
    <div class="crop-size"><span data-i18n="label.width"></span><input id="crop-w" type="text" inputmode="text" spellcheck="false" /></div>
    <button id="crop-link" data-i18n-title="new.lockRatio"><svg viewBox="0 0 24 24"><path d="M9.5 8H8a4 4 0 0 0 0 8h1.5"/><path d="M14.5 8H16a4 4 0 0 1 0 8h-1.5"/><path d="M8.5 12h7"/></svg></button>
    <div class="crop-size"><span data-i18n="label.height"></span><input id="crop-h" type="text" inputmode="text" spellcheck="false" /></div>
    <button id="crop-ok" data-i18n-title="crop.apply"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l5 5L19.5 7"/></svg></button>
    <button id="crop-cancel" data-i18n-title="crop.cancel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>


  <div id="brushbar">
    <div class="vsl bb-size" id="bp-size-sl"><div class="vsl-fill" id="bp-size-fill"></div><div class="vsl-knob" id="bp-size-knob"></div></div>
    <button id="bb-pick" data-i18n-title="tool.pick"><svg viewBox="0 0 24 24"><path d="M15.4 4.3l.9-.9a2.33 2.33 0 0 1 3.3 3.3l-.9.9"/><path d="M13.3 6.4l4.3 4.3"/><path d="M15.1 9.2L6.9 17.4c-.5.5-2.5 1.1-3.2.8-.3-.7.3-2.7.8-3.2l8.2-8.2 2.4 2.4z"/></svg></button>
    <div class="vsl bb-op" id="bp-op-sl"><div class="vsl-fill" id="bp-op-fill"></div><div class="vsl-knob" id="bp-op-knob"></div></div>
    <div class="bb-sep"></div>
    <button id="bb-undo" data-i18n-title="edit.undo"><svg viewBox="0 0 24 24"><path d="M4.5 9H12a5.5 5.5 0 1 1 0 11H9"/><path d="M8 5.5L4.5 9 8 12.5"/></svg></button>
    <button id="bb-redo" data-i18n-title="edit.redo"><svg viewBox="0 0 24 24"><path d="M19.5 9H12a5.5 5.5 0 1 0 0 11h-3"/><path d="M16 5.5L19.5 9 16 12.5"/></svg></button>
  </div>
  <div id="pickflag"><svg viewBox="0 0 24 24"><path d="M15.4 4.3l.9-.9a2.33 2.33 0 0 1 3.3 3.3l-.9.9"/><path d="M13.3 6.4l4.3 4.3"/><path d="M15.1 9.2L6.9 17.4c-.5.5-2.5 1.1-3.2.8-.3-.7.3-2.7.8-3.2l8.2-8.2 2.4 2.4z"/></svg><span data-i18n="tool.pickShort"></span></div>
  <div id="eyedrop"><span id="eyedrop-found"></span><span id="eyedrop-cur"></span><b id="eyedrop-hex"></b></div>
  <div id="bb-val"></div>
  <div id="bcpop" class="toolpop">
    <div class="bp-head"><span class="bp-title" id="bc-title" data-i18n="pop.bc"></span><button class="win-x" data-i18n-title="btn.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="chips" id="bc-scope">
      <button data-scope="layer" data-i18n="bc.scopeLayer"></button>
      <button data-scope="canvas" data-i18n="bc.scopeCanvas"></button>
    </div>
    <div class="irow"><label data-i18n="label.brightness"></label><input id="bc-bri" type="range" min="-100" max="100" step="1" value="0" /><b id="bc-briv">0</b></div>
    <div class="irow"><label data-i18n="label.contrast"></label><input id="bc-con" type="range" min="-100" max="100" step="1" value="0" /><b id="bc-conv">0</b></div>
    <div class="irow"><label data-i18n="label.saturation"></label><input id="bc-sat" type="range" min="-100" max="100" step="1" value="0" /><b id="bc-satv">0</b></div>
    <div class="irow"><label data-i18n="label.hue"></label><input id="bc-hue" type="range" min="-180" max="180" step="1" value="0" /><b id="bc-huev">0</b></div>
    <div class="iact"><button id="bc-cancel" data-i18n="btn.cancel" class="txtbtn"></button><button id="bc-apply" data-i18n="btn.apply" class="txtbtn primary"></button></div>
  </div>

  <div id="adjpop" class="toolpop">
    <div class="bp-head"><span class="bp-title" data-i18n="pop.adjust"></span><button class="win-x" data-i18n-title="btn.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="chips" id="adj-modes">
      <button data-m="dodge" class="on" data-i18n="adj.dodge"></button>
      <button data-m="burn" data-i18n="adj.burn"></button>
      <button data-m="colorize" data-i18n="adj.colorize"></button>
    </div>
    <div class="irow"><label data-i18n="label.strength"></label><input id="adj-amt" type="range" min="2" max="30" step="1" value="8" /><b id="adj-amtv">8</b></div>
    <p class="hint" style="margin:0 2px" data-i18n="hint.adjust"></p>
  </div>

  <div id="lassopop" class="toolpop">
    <div class="bp-head"><span class="bp-title" data-i18n="lasso.title"></span><button class="win-x" data-i18n-title="btn.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="chips" id="lasso-mode">
      <button data-v="continuous" data-i18n="lasso.continuous"></button>
      <button data-v="segment" data-i18n="lasso.segment"></button>
    </div>
    <div class="chips" id="lasso-op">
      <button data-v="replace" data-i18n="lasso.new"></button>
      <button data-v="add" data-i18n="lasso.add"></button>
      <button data-v="subtract" data-i18n="lasso.subtract"></button>
      <button data-v="intersect" data-i18n="lasso.intersect"></button>
    </div>
  </div>

  <div id="fx-panel">
    <div class="pop-head" id="fx-head"><span class="pop-title" data-i18n="label.effects"></span>
      <span class="pop-acts"><button class="win-x" data-i18n-title="btn.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></span></div>
    <div id="fx-types">
      <button data-fx="stroke" data-i18n-title="fx.stroke"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/><rect x="3.5" y="3.5" width="17" height="17" rx="3"/></svg></button>
      <button data-fx="glow" data-i18n-title="fx.glow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
      <button data-fx="dropShadow" data-i18n-title="fx.dropShadow"><svg viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="1.5" fill="currentColor" stroke="none"/><rect x="4.5" y="4.5" width="11" height="11" rx="1.5"/></svg></button>
      <button data-fx="innerShadow" data-i18n-title="fx.innerShadow"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><path d="M6.5 13a6.5 6.5 0 0 1 6.5-6.5"/></svg></button>
    </div>
    <div id="fx-rsz" data-i18n-title="ui.resizePanel"><svg viewBox="0 0 24 24"><path d="M19 13l-6 6M19 17.5L16.5 20"/></svg></div>
  </div>

  <div id="fx-edit" class="toolpop">
    <div class="bp-head"><span class="bp-title" id="fx-edit-title" data-i18n="label.effect"></span><button class="win-x" data-i18n-title="btn.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="irow fxf-size"><label data-i18n="label.size"></label><input id="fx-size" type="range" min="1" max="16" step="1" value="1" /><b id="fx-sizev">1</b></div>
    <div class="irow fxf-intensity"><label data-i18n="label.intensity"></label><input id="fx-int" type="range" min="5" max="100" step="5" value="80" /><b id="fx-intv">80%</b></div>
    <div class="irow fxf-offset"><label data-i18n="label.offsetX"></label><input id="fx-dx" type="range" min="-12" max="12" step="1" value="2" /><b id="fx-dxv">2</b></div>
    <div class="irow fxf-offset"><label data-i18n="label.offsetY"></label><input id="fx-dy" type="range" min="-12" max="12" step="1" value="2" /><b id="fx-dyv">2</b></div>
    <div class="irow fxf-color"><label data-i18n="label.color"></label><button id="fx-colsw" class="fx-colbtn"></button></div>
    <div class="iact"><button id="fx-cancel" data-i18n="btn.cancel" class="txtbtn"></button><button id="fx-apply" data-i18n="btn.apply" class="txtbtn primary"></button></div>
  </div>

  <div id="zoom-status">100%</div>
  <div id="status">32×32 px</div>

  <footer id="palbar">
    <div id="palgrip" class="pop-head" data-i18n-title="ui.dragPalette"><span class="pop-title" id="palgrip-label"></span>
      <span class="pop-acts">
        <button class="win-x" data-i18n-title="btn.close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </span>
    </div>
    <div id="pal"></div>
    <div id="pal-act" class="lay-act pal-act">
      <button id="pal-new" data-i18n-title="palette.new"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      <button id="pal-file" data-i18n-title="btn.fromImage"><svg viewBox="0 0 24 24"><rect x="4.5" y="5" width="15" height="14" rx="2"/><path d="M8 14l2.7-3 3.2 3.8 1.6-1.8 3 3.5"/><circle cx="8.5" cy="8.8" r="1.2"/></svg></button>

    <button id="trctx-flip-h" data-i18n="menu.flipH"></button>
    <button id="trctx-flip-v" data-i18n="menu.flipV"></button>
    <button id="trctx-rot-r" data-i18n="menu.rotateRight"></button>
    <button id="trctx-rot-l" data-i18n="menu.rotateLeft"></button>
  </div>
  <div id="impmenu">
    <button id="impmenu-photo" data-i18n="import.photo"></button>
    <button id="impmenu-file" data-i18n="import.file"></button>
    <button id="impmenu-pix" data-i18n="import.pixelize"></button>
  </div>
  <div id="fxctx">
    <button id="fxctx-edit" data-i18n="menu.edit"></button>
    <button id="fxctx-aslayer" data-i18n="menu.fxAsLayer"></button>
    <button id="fxctx-copy" data-i18n="menu.fxCopy"></button>
    <button id="fxctx-dup" data-i18n="menu.duplicate"></button>
    <button id="fxctx-del" data-i18n="menu.delete"></button>
  </div>
  <div id="setmenu"></div>
  <div id="rowctx"></div>

  <div id="ren-ovl" class="ovl"><div class="sheet">
    <h3 data-i18n="dialog.rename"></h3>
    <div class="irow"><input id="ren-name" type="text" maxlength="24" style="flex:1" /></div>
    <div class="iact"><button id="ren-cancel" data-i18n="btn.cancel" class="txtbtn"></button><button id="ren-ok" data-i18n="btn.save" class="txtbtn primary"></button></div>
  </div></div>

  <div id="imp-ovl" class="ovl"><div id="imp-box" class="sheet">
    <h3 id="imp-grip" data-i18n="dialog.import"></h3>
    <canvas id="imp-prev"></canvas>
    <div class="irow"><label data-i18n="label.rotate90"></label><button id="imp-rot" class="txtbtn" style="height:40px">⟳ 90°</button><span class="hint" data-i18n="hint.beforeSym"></span></div>
    <div class="irow"><label data-i18n="label.colors"></label><input id="imp-colors" type="range" min="0" max="48" step="1" value="24" /><b id="imp-colorsv">24</b></div>
    <div class="irow"><label data-i18n="label.detail"></label><input id="imp-cell" type="range" min="0" max="256" step="4" value="0" /><b id="imp-cellv" data-i18n="import.auto"></b></div>
    <div class="irow"><label data-i18n="label.bgTol"></label><input id="imp-bgtol" type="range" min="0" max="120" step="2" value="30" /><b id="imp-bgtolv">30</b></div>
    <div class="irow"><label data-i18n="label.clean"></label><span class="hint" data-i18n="hint.despeckle"></span><label class="switch"><input id="imp-clean" type="checkbox" /><span></span></label></div>
    <div class="irow"><label data-i18n="label.symmetry"></label><span class="hint" data-i18n="hint.staysSym"></span><label class="switch"><input id="imp-sym" type="checkbox" /><span></span></label></div>
    <div class="iact"><button id="imp-cancel" data-i18n="btn.cancel" class="txtbtn"></button><button id="imp-asis" data-i18n="btn.insertAsIs" class="txtbtn"></button><button id="imp-apply" data-i18n="btn.apply" class="txtbtn primary"></button></div>
  </div></div>

  <div id="new-ovl" class="ovl gallery-only"><div class="new-panel">
    <header class="new-head"><h3 data-i18n="dialog.newCanvas"></h3></header>
    <div id="new-scroll" class="new-scroll">
      <div class="new-presets">
        <section class="new-group"><h4 data-i18n="new.sprites"></h4><div id="new-sprites" class="new-stack"></div></section>
        <section class="new-group"><h4 data-i18n="new.gameFrames"></h4><div id="new-frames" class="new-stack"></div></section>
      </div>
      <section class="new-saved"><h4 data-i18n="new.saved"></h4><div id="new-saved" class="new-stack"></div></section>
    </div>
    <section class="new-custom">
      <h4 data-i18n="new.custom"></h4>
      <div class="new-name-field"><span data-i18n="label.name"></span><input id="new-name-in" type="text" maxlength="24" value="64 x 64" /></div>
      <div class="new-custom-grid">
        <label><span data-i18n="label.width"></span><input id="new-w" type="text" inputmode="text" spellcheck="false" value="64" /></label>
        <button id="new-link" class="new-link" data-i18n-title="new.lockRatio"><svg viewBox="0 0 24 24"><path d="M9.5 8H8a4 4 0 0 0 0 8h1.5"/><path d="M14.5 8H16a4 4 0 0 1 0 8h-1.5"/><path d="M8.5 12h7"/></svg></button>
        <label><span data-i18n="label.height"></span><input id="new-h" type="text" inputmode="text" spellcheck="false" value="64" /></label>
        <button id="new-bg" class="new-bg" type="button" data-i18n-title="new.background"><span id="new-bg-swatch"></span><em id="new-bg-text"></em></button>
      </div>
      <label class="new-save"><input id="new-save" type="checkbox" /><span></span><b data-i18n="new.savePreset"></b></label>
      <div class="new-mode"><span data-i18n="new.colorMode"></span><div>
        <button id="new-mode-rgba" type="button" class="on">RGBA</button>
        <button id="new-mode-gray" type="button">Grayscale</button>
      </div></div>
      <button id="new-create" class="txtbtn primary" data-i18n="btn.create"></button>
    </section>
  </div></div>

  <div id="ovl" class="ovl"><div id="ovlbox" class="sheet">
    <h3 data-i18n="dialog.done"></h3>
    <p data-i18n="ovl.saveHint"></p>
    <img id="ovlimg" data-i18n-alt="label.result" />
    <div><button id="ovlclose" data-i18n="btn.close" class="txtbtn primary"></button></div>
  </div></div>

  <div id="gallery">
    <header id="gal-top">
      <span id="gal-left"><button id="gal-back" style="display:none">‹</button><span id="gal-title">Pixel Heart</span></span>
      <div class="gal-actions">
        <button id="gal-stack" data-i18n="gallery.stack" style="display:none"></button>
        <button id="gal-dup" data-i18n="gallery.duplicate" style="display:none"></button>
        <button id="gal-del" data-i18n="gallery.delete" style="display:none"></button>
        <button id="gal-select" data-i18n="gallery.select"></button>
        <button id="gal-import" data-i18n="gallery.import"></button>
        <button id="gal-photo" data-i18n="gallery.photo"></button>
        <span class="gal-icons">
          <button id="gal-settings" data-i18n-title="ui.settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <button id="gal-new" data-i18n-title="gallery.new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        </span>
      </div>
    </header>
    <div id="gal-grid"></div>
  </div>

  <div id="toast"></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
