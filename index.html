<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Pixel Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d10;
      --panel: rgba(26, 26, 31, .82);
      --panel-solid: #1a1a1f;
      --line: rgba(255, 255, 255, .08);
      --txt: #f2f2f5;
      --txt2: #9a9aa3;
      --accent: #3d8bfd;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--txt);
      font: 14px/1.4 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation; overscroll-behavior: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* ---- кнопки ---- */
    button { background: transparent; border: 0; color: var(--txt); width: 40px; height: 40px;
      border-radius: 10px; display: grid; place-items: center; padding: 0; cursor: pointer;
      font: inherit; flex: none; transition: background .12s, transform .08s, color .12s; }
    button:active { background: rgba(255, 255, 255, .1); transform: scale(.94); }
    button.on { background: var(--accent); color: #fff; }
    button svg { width: 22px; height: 22px; stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .txtbtn { width: auto; min-width: 44px; height: 44px; padding: 0 18px; border-radius: 12px;
      background: rgba(255, 255, 255, .08); font-size: 15px; font-weight: 600; }
    .txtbtn.primary { background: var(--accent); color: #fff; }

    /* ---- верхняя панель ---- */
    #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      padding: calc(env(safe-area-inset-top, 0px) + 6px) max(10px, env(safe-area-inset-right, 0px)) 6px max(10px, env(safe-area-inset-left, 0px));
      background: var(--panel); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border-bottom: 1px solid var(--line); }
    .tb-group { display: flex; align-items: center; gap: 4px; }
    .tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
    #activewrap { position: relative; width: 34px; height: 34px; margin-left: 6px; flex: none; }
    #activewrap input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
    #active { display: block; width: 100%; height: 100%; border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .3); box-shadow: 0 1px 6px rgba(0, 0, 0, .4); pointer-events: none; }

    /* ---- боковая колонка (как в Procreate) ---- */
    #sidebar { position: fixed; left: max(8px, env(safe-area-inset-left, 0px)); top: 50%;
      transform: translateY(-50%); z-index: 9; display: flex; flex-direction: column; gap: 2px; padding: 6px;
      background: var(--panel); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--line); border-radius: 14px; }
    #sidebar button { width: 38px; height: 38px; }
    .sb-sep { height: 1px; background: var(--line); margin: 4px 2px; }

    /* ---- нижняя палитра ---- */
    #palbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; align-items: center; gap: 8px;
      padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(12px, env(safe-area-inset-left, 0px));
      background: var(--panel); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border-top: 1px solid var(--line); }
    #pal { display: flex; align-items: center; gap: 8px; flex: 1; overflow-x: auto;
      touch-action: pan-x; padding: 3px 2px; scrollbar-width: none; }
    #pal::-webkit-scrollbar { display: none; }
    .sw { width: 32px; height: 32px; border-radius: 9px; border: 1px solid rgba(255, 255, 255, .14); }
    .sw.on { box-shadow: 0 0 0 2px #fff; border-color: transparent; }
    .pal-hint { color: var(--txt2); font-size: 12px; white-space: nowrap; }

    /* ---- панель слоёв ---- */
    #lay-pop { position: fixed; right: max(10px, env(safe-area-inset-right, 0px));
      top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 20; width: 272px;
      background: var(--panel-solid); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 14px 44px rgba(0, 0, 0, .55); display: none; overflow: hidden; }
    #lay-pop.on { display: block; animation: pop .18s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(-6px); } }
    .pop-head { display: flex; align-items: center; justify-content: space-between;
      padding: 10px 8px 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
    .pop-head button { width: 34px; height: 34px; background: rgba(255, 255, 255, .08); }
    #lay-list { max-height: 42vh; overflow-y: auto; padding: 6px; }
    .lrow { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; cursor: pointer; }
    .lrow.on { background: rgba(61, 139, 253, .18); outline: 1px solid rgba(61, 139, 253, .5); }
    .lth { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); flex: none; }
    .lname { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .eye { width: 34px; height: 34px; color: var(--txt2); }
    .eye.off { opacity: .35; }
    .eye .slash { display: none; }
    .eye.off .slash { display: block; }
    .lay-ops { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--line); }
    .lay-ops label { color: var(--txt2); font-size: 12px; flex: none; }
    .lay-ops b { min-width: 42px; text-align: right; font-size: 13px; }
    .lay-act { display: flex; justify-content: space-around; padding: 6px; border-top: 1px solid var(--line); }
    .lay-act button { width: 44px; height: 38px; color: var(--txt2); }
    .lay-act button:active { color: var(--txt); }

    /* ---- слайдеры ---- */
    input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 28px; background: transparent; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: #3a3a40; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%;
      background: #fff; margin-top: -9px; box-shadow: 0 1px 5px rgba(0, 0, 0, .45); border: 0; }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #3a3a40; }
    input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; }

    /* ---- переключатели (iOS-стиль) ---- */
    .switch { position: relative; width: 50px; height: 30px; flex: none; margin-left: auto; }
    .switch input { display: none; }
    .switch span { position: absolute; inset: 0; border-radius: 15px; background: #3a3a40; transition: background .2s; }
    .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 26px; height: 26px;
      border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(20px); }

    /* ---- шторки/диалоги ---- */
    .ovl { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 60;
      display: none; align-items: flex-end; justify-content: center; }
    .ovl.on { display: flex; }
    .sheet { width: 100%; max-width: 520px; background: var(--panel-solid);
      border: 1px solid var(--line); border-radius: 20px 20px 0 0;
      padding: 18px 18px calc(env(safe-area-inset-bottom, 0px) + 16px);
      max-height: 92vh; overflow-y: auto; animation: up .28s cubic-bezier(.2, .9, .25, 1); }
    @keyframes up { from { transform: translateY(48px); opacity: .5; } }
    .sheet h3 { margin: 2px 0 14px; font-size: 17px; font-weight: 700; }
    .irow { display: flex; align-items: center; gap: 12px; min-height: 44px; }
    .irow label { color: var(--txt2); min-width: 104px; font-size: 13px; }
    .irow b { min-width: 30px; text-align: right; }
    .irow input[type=number] { width: 76px; background: #101014; color: var(--txt); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 10px; font: inherit; }
    .hint { color: var(--txt2); font-size: 12px; }
    .iact { display: flex; gap: 10px; margin-top: 16px; }
    .iact .txtbtn { flex: 1; }
    .iact .primary { flex: 2; }
    #imp-prev { width: 100%; height: clamp(180px, 32vh, 340px); border-radius: 12px;
      background: #101014; border: 1px solid var(--line); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 10px; }
    .chips button { width: auto; min-width: 56px; height: 40px; padding: 0 14px;
      background: rgba(255, 255, 255, .08); border-radius: 999px; font-size: 14px; }
    .chips button.on { background: var(--accent); }
    #ovlbox { text-align: center; }
    #ovlbox p { color: var(--txt2); margin: 0 0 14px; font-size: 13px; }
    #ovlimg { width: min(64vmin, 380px); height: auto; image-rendering: pixelated;
      background: #101014; border: 1px solid var(--line); border-radius: 12px; }
    #ovlclose { margin-top: 16px; width: 100%; }

    /* ---- тост ---- */
    #toast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 64px); left: 50%;
      transform: translateX(-50%) translateY(-8px); z-index: 80; background: rgba(20, 20, 24, .94);
      border: 1px solid var(--line); padding: 9px 18px; border-radius: 999px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: opacity .22s, transform .22s; white-space: nowrap; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    input[type=file] { display: none; }

    /* ---- планшет / десктоп ---- */
    @media (min-width: 768px) {
      #topbar { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px; }
      .tb-group { gap: 6px; }
      button { width: 46px; height: 46px; border-radius: 12px; }
      button svg { width: 24px; height: 24px; }
      #activewrap { width: 38px; height: 38px; margin-left: 10px; }
      #sidebar button { width: 44px; height: 44px; }
      #palbar { left: 50%; right: auto; transform: translateX(-50%); width: min(680px, 92vw);
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); border: 1px solid var(--line);
        border-radius: 18px; padding: 10px 14px; }
      .sw { width: 36px; height: 36px; border-radius: 10px; }
      .ovl { align-items: center; padding: 24px; }
      .sheet { border-radius: 20px; padding-bottom: 18px; width: 480px; }
      #lay-pop { width: 300px; top: calc(env(safe-area-inset-top, 0px) + 70px); }
    }
    @media (max-width: 430px) {
      #topbar { padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
      .tb-group { gap: 3px; }
      button { width: 38px; height: 38px; }
      button svg { width: 21px; height: 21px; }
      .tb-sep { margin: 0 2px; }
      #activewrap { width: 33px; height: 33px; margin-left: 2px; }
    }
    @media (max-width: 374px) {
      button { width: 35px; height: 35px; }
      button svg { width: 19px; height: 19px; }
    }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>

  <header id="topbar">
    <div class="tb-group">
      <button id="new" title="Новый холст"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><path d="M12 8.5v7M8.5 12h7"/></svg></button>
      <button id="imp" title="Импорт картинки"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle cx="8.8" cy="10" r="1.4" fill="currentColor" stroke="none"/><path d="M5.5 16.5l4-4 2.8 2.8 2.4-2.4 4.3 4.3"/></svg></button>
      <button id="exp" title="Сохранить PNG"><svg viewBox="0 0 24 24"><path d="M12 3.5V14"/><path d="M8.5 7L12 3.5 15.5 7"/><path d="M7.5 10.5H7a2.5 2.5 0 0 0-2.5 2.5v5A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5v-5a2.5 2.5 0 0 0-2.5-2.5h-.5"/></svg></button>
    </div>
    <div class="tb-group">
      <button id="t-pencil" class="on" title="Карандаш"><svg viewBox="0 0 24 24"><path d="M4.5 19.5l.9-3.6L16.6 4.7a2.05 2.05 0 0 1 2.9 2.9L8.3 18.8l-3.8.7z"/><path d="M14.7 6.6l2.9 2.9"/></svg></button>
      <button id="t-eraser" title="Ластик"><svg viewBox="0 0 24 24"><path d="M8.7 18.7H6.3L4 16.4a1.9 1.9 0 0 1 0-2.7l8.6-8.6a1.9 1.9 0 0 1 2.7 0l4 4a1.9 1.9 0 0 1 0 2.7l-7 6.9z"/><path d="M9.3 8.3l6.4 6.4"/><path d="M12.5 20.5H20"/></svg></button>
      <button id="t-fill" title="Заливка"><svg viewBox="0 0 24 24"><path d="M11.3 3.8l7 7-6.2 6.2a1.9 1.9 0 0 1-2.7 0l-4.3-4.3a1.9 1.9 0 0 1 0-2.7l6.2-6.2z"/><path d="M4.6 12.5h12.2"/><path d="M19.9 14.6s1.6 2 1.6 3.1a1.6 1.6 0 0 1-3.2 0c0-1.1 1.6-3.1 1.6-3.1z"/></svg></button>
      <button id="t-pick" title="Пипетка"><svg viewBox="0 0 24 24"><path d="M15.4 4.3l.9-.9a2.33 2.33 0 0 1 3.3 3.3l-.9.9"/><path d="M13.3 6.4l4.3 4.3"/><path d="M15.1 9.2L6.9 17.4c-.5.5-2.5 1.1-3.2.8-.3-.7.3-2.7.8-3.2l8.2-8.2 2.4 2.4z"/></svg></button>
      <div class="tb-sep"></div>
      <button id="layers" title="Слои"><svg viewBox="0 0 24 24"><path d="M12 3.5l8.5 4.5L12 12.5 3.5 8 12 3.5z"/><path d="M4.5 12.5L12 16.5l7.5-4"/><path d="M4.5 16.5L12 20.5l7.5-4"/></svg></button>
      <label id="activewrap" title="Цвет"><input id="picker" type="color" value="#ff7a18" /><span id="active"></span></label>
    </div>
  </header>

  <aside id="sidebar">
    <button id="zin" title="Приблизить"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    <button id="zout" title="Отдалить"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <button id="fit" title="Вписать"><svg viewBox="0 0 24 24"><path d="M9 4.5H7A2.5 2.5 0 0 0 4.5 7v2M15 4.5h2A2.5 2.5 0 0 1 19.5 7v2M9 19.5H7A2.5 2.5 0 0 1 4.5 17v-2M15 19.5h2a2.5 2.5 0 0 0 2.5-2.5v-2"/></svg></button>
    <div class="sb-sep"></div>
    <button id="undo" title="Отменить"><svg viewBox="0 0 24 24"><path d="M4.5 9H12a5.5 5.5 0 1 1 0 11H9"/><path d="M8 5.5L4.5 9 8 12.5"/></svg></button>
    <button id="redo" title="Вернуть"><svg viewBox="0 0 24 24"><path d="M19.5 9H12a5.5 5.5 0 1 0 0 11h-3"/><path d="M16 5.5L19.5 9 16 12.5"/></svg></button>
    <div class="sb-sep"></div>
    <button id="sym" title="Симметрия"><svg viewBox="0 0 24 24"><path d="M12 4v16" stroke-dasharray="3 3"/><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/></svg></button>
    <button id="outline" title="Обводка контуром"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8" rx="1"/><rect x="4.5" y="4.5" width="15" height="15" rx="3" stroke-dasharray="3 3"/></svg></button>
  </aside>

  <footer id="palbar">
    <div id="pal"></div>
    <span class="pal-hint">долгий тап — пипетка</span>
  </footer>

  <div id="lay-pop">
    <div class="pop-head"><span>Слои</span>
      <button id="lay-add" title="Новый слой"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
    </div>
    <div id="lay-list"></div>
    <div class="lay-ops">
      <label>Непрозрачность</label>
      <input id="lay-op" type="range" min="0" max="100" step="1" value="100" />
      <b id="lay-opv">100%</b>
    </div>
    <div class="lay-act">
      <button id="lay-up" title="Выше"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      <button id="lay-down" title="Ниже"><svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      <button id="lay-dup" title="Дублировать"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 4.5H6.5A2.5 2.5 0 0 0 4 7v9.5"/></svg></button>
      <button id="lay-del" title="Удалить"><svg viewBox="0 0 24 24"><path d="M4.5 6.5h15"/><path d="M8 6V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1"/><path d="M6.5 6.5l.8 11.7A2 2 0 0 0 9.3 20h5.4a2 2 0 0 0 2-1.8l.8-11.7"/><path d="M10 10.5v6M14 10.5v6"/></svg></button>
    </div>
  </div>

  <div id="imp-ovl" class="ovl"><div id="imp-box" class="sheet">
    <h3>Импорт в пиксель-арт</h3>
    <canvas id="imp-prev"></canvas>
    <div class="irow"><label>Цвета палитры</label><input id="imp-colors" type="range" min="0" max="48" step="1" value="24" /><b id="imp-colorsv">24</b></div>
    <div class="irow"><label>Детализация</label><input id="imp-cell" type="range" min="0" max="128" step="4" value="0" /><b id="imp-cellv">Авто</b></div>
    <div class="irow"><label>Отсечение фона</label><input id="imp-bgtol" type="range" min="0" max="120" step="2" value="30" /><b id="imp-bgtolv">30</b></div>
    <div class="irow"><label>Чистка мусора</label><span class="hint">битые пиксели и дырки</span><label class="switch"><input id="imp-clean" type="checkbox" /><span></span></label></div>
    <div class="irow"><label>Симметрия</label><span class="hint">останется при рисовании</span><label class="switch"><input id="imp-sym" type="checkbox" /><span></span></label></div>
    <div class="iact"><button id="imp-cancel" class="txtbtn">Отмена</button><button id="imp-apply" class="txtbtn primary">Применить</button></div>
  </div></div>

  <div id="new-ovl" class="ovl"><div class="sheet">
    <h3>Новый холст</h3>
    <div class="chips" id="new-chips">
      <button data-s="16">16</button><button data-s="24">24</button><button data-s="32" class="on">32</button>
      <button data-s="48">48</button><button data-s="64">64</button><button data-s="128">128</button>
    </div>
    <div class="irow"><label>Свой размер</label><input id="new-size" type="number" min="2" max="256" step="1" value="32" inputmode="numeric" /><span class="hint">2–256 пикселей</span></div>
    <div class="iact"><button id="new-cancel" class="txtbtn">Отмена</button><button id="new-create" class="txtbtn primary">Создать</button></div>
  </div></div>

  <div id="ovl" class="ovl"><div id="ovlbox" class="sheet">
    <h3>Готово</h3>
    <p>Зажми картинку → «Сохранить изображение», и она появится в Фото</p>
    <img id="ovlimg" alt="результат" />
    <div><button id="ovlclose" class="txtbtn primary">Закрыть</button></div>
  </div></div>

  <div id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const cv = $('cv'), ctx = cv.getContext('2d');

    // ---- состояние ----
    let W = 32, H = 32, layerSeq = 1;
    function blank(w, h) { return Array.from({ length: h }, () => new Array(w).fill(null)); }
    function newLayer(name) { return { name, grid: blank(W, H), opacity: 1, visible: true }; }
    let layers = [newLayer('Слой 1')], cur = 0;
    const G = () => layers[cur].grid;
    let palette = ['#0c0c10', '#202733', '#cbd3dc', '#e9edf0', '#ff7a18', '#c74a00', '#78d7ff'].map(hexToRgb);
    let active = palette[4];
    let tool = 'pencil', sym = false;
    const view = { zoom: 12, ox: 0, oy: 0 };
    const undoStack = [], redoStack = [];

    function hexToRgb(h) { const s = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(s.slice(i, i + 2), 16)); }
    const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
    const eqc = (a, b) => a && b && a[0] === b[0] && a[1] === b[1] && a[2] === b[2];

    let toastT = null;
    function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show');

      view.zoom = Math.max(1, Math.min(48, pinch.zoom * (d / pinch.d)));
      view.ox = (mid.x - r.left) - pinch.wx * view.zoom; view.oy = (mid.y - r.top) - pinch.wy * view.zoom; render(); }
    cv.addEventListener('wheel', (e) => { e.preventDefault(); const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const wx = (mx - view.ox) / view.zoom, wy = (my - view.oy) / view.zoom; view.zoom = Math.max(1, Math.min(48, view.zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
      view.ox = mx - wx * view.zoom; view.oy = my - wy * view.zoom; render(); }, { passive: false });
    function zoomBy(f) { const cw = cv.clientWidth / 2, chh = cv.clientHeight / 2, wx = (cw - view.ox) / view.zoom, wy = (chh - view.oy) / view.zoom;
      view.zoom = Math.max(1, Math.min(48, view.zoom * f)); view.ox = cw - wx * view.zoom; view.oy = chh - wy * view.zoom; render(); }

    // ---- палитра / инструменты ----
    function setTool(t) { tool = t; for (const id of ['pencil', 'eraser', 'pick', 'fill']) $('t-' + id).classList.toggle('on', id === t); }
    function refreshActive() { $('active').style.background = rgb(active); }
    function buildPalette() { const box = $('pal'); box.innerHTML = '';
      palette.forEach((c) => { const b = document.createElement('button'); b.className = 'sw'; b.style.background = rgb(c);
        if (eqc(c, active)) b.classList.add('on'); b.addEventListener('click', () => { active = c.slice(); refreshActive(); buildPalette(); setTool('pencil'); }); box.appendChild(b); }); }
    function addColor(hex) { const c = hexToRgb(hex); if (!palette.some((p) => eqc(p, c))) palette.push(c); active = c; refreshActive(); buildPalette(); setTool('pencil'); }

    // ---- слои: список, выбор, операции ----
    const EYE = '<svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.6"/><path class="slash" d="M4 4l16 16"/></svg>';
    function layList() {
      const box = $('lay-list'); box.innerHTML = '';
      for (let i = layers.length - 1; i >= 0; i--) { const L = layers[i];
        const row = document.createElement('div'); row.className = 'lrow' + (i === cur ? ' on' : '');
        const th = document.createElement('canvas'); th.className = 'lth'; th.width = 40; th.height = 40;
        const tx = th.getContext('2d'); tx.imageSmoothingEnabled = false;
        tx.fillStyle = '#26262c'; tx.fillRect(0, 0, 40, 40); tx.fillStyle = '#1d1d23';
        for (let yy = 0; yy < 5; yy++) for (let xx = 0; xx < 5; xx++) if ((xx + yy) & 1) tx.fillRect(xx * 8, yy * 8, 8, 8);
        const k = Math.min(40 / W, 40 / H), w2 = Math.max(1, Math.round(W * k)), h2 = Math.max(1, Math.round(H * k));
        tx.drawImage(layerCanvas(i), (40 - w2) / 2, (40 - h2) / 2, w2, h2);
        const nm = document.createElement('span'); nm.className = 'lname'; nm.textContent = L.name;
        const eye = document.createElement('button'); eye.className = 'eye' + (L.visible ? '' : ' off'); eye.innerHTML = EYE;
        eye.addEventListener('click', (ev) => { ev.stopPropagation(); snapshot(); L.visible = !L.visible; layList(); render(); });
        row.append(th, nm, eye);
        row.addEventListener('click', ((idx) => () => { cur = idx; layList(); })(i));
        box.appendChild(row);
      }
      syncOp();
    }
    function syncOp() { const v = Math.round(layers[cur].opacity * 100); $('lay-op').value = v; $('lay-opv').textContent = v + '%'; }
    $('layers').addEventListener('click', () => { const p = $('lay-pop'); const on = p.classList.toggle('on');
      $('layers').classList.toggle('on', on); if (on) layList(); });
    $('lay-add').addEventListener('click', () => { if (layers.length >= 8) { toast('Максимум 8 слоёв'); return; }
      snapshot(); layers.splice(cur + 1, 0, newLayer('Слой ' + (++layerSeq))); cur++; dirtyAll(); layList(); render(); });
    $('lay-dup').addEventListener('click', () => { if (layers.length >= 8) { toast('Максимум 8 слоёв'); return; }
      snapshot(); const L = layers[cur]; layers.splice(cur + 1, 0, { name: L.name + ' копия', opacity: L.opacity, visible: L.visible, grid: cloneGrid(L.grid) });
      cur++; dirtyAll(); layList(); render(); });
    $('lay-del').addEventListener('click', () => { if (layers.length < 2) { toast('Это единственный слой'); return; }
      snapshot(); layers.splice(cur, 1); cur = Math.max(0, cur - 1); dirtyAll(); layList(); render(); });
    $('lay-up').addEventListener('click', () => { if (cur >= layers.length - 1) return;
      snapshot(); [layers[cur], layers[cur + 1]] = [layers[cur + 1], layers[cur]]; cur++; dirtyAll(); layList(); render(); });
    $('lay-down').addEventListener('click', () => { if (cur <= 0) return;
      snapshot(); [layers[cur], layers[cur - 1]] = [layers[cur - 1], layers[cur]]; cur--; dirtyAll(); layList(); render(); });
    $('lay-op').addEventListener('pointerdown', () => snapshot());
    $('lay-op').addEventListener('input', () => { layers[cur].opacity = +$('lay-op').value / 100; syncOp(); render(); });

    // ---- импорт ----
    let impData = null, impGrid = null, impTimer = null;
    function openImport(file) {
      if (!file) return;
      const im = new Image();
      im.onerror = () => toast('Не удалось открыть картинку');
      im.onload = () => {
        const MAX = 600, k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, w, h);
        impData = x.getImageData(0, 0, w, h);
        $('imp-ovl').classList.add('on'); impConvert();
      };
      im.src = URL.createObjectURL(file);
    }
    function impConvert() {
      if (!impData) return;
      const colors = +$('imp-colors').value, detail = +$('imp-cell').value, bgtol = +$('imp-bgtol').value;
      const cell = detail > 0 ? impData.width / detail : 0; // «Детализация» = ширина результата в клетках
      const r = sampleGrid({ w: impData.width, h: impData.height, ch: 4, data: impData.data }, cell, bgtol);
      let g = r.grid;
      if (colors > 0 && r.samples.length) { const pal = medianCut(r.samples, colors); g = g.map((row) => row.map((c) => (c ? nearest(c, pal) : null))); }
      if ($('imp-sym').checked) g = symmetrizeV(g, r.nx, r.ny);
      if ($('imp-clean').checked) g = despeckle(g, r.nx, r.ny);
      impGrid = g; drawTo($('imp-prev'), g, r.nx, r.ny);
    }
    const impSoon = () => { clearTimeout(impTimer); impTimer = setTimeout(impConvert, 60); };
    function drawTo(cvp, g, nx, ny) {
      const dpr = window.devicePixelRatio || 1, cw = cvp.clientWidth, chh = cvp.clientHeight;
      if (cvp.width !== Math.round(cw * dpr)) { cvp.width = Math.round(cw * dpr); cvp.height = Math.round(chh * dpr); }
      const c = cvp.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.imageSmoothingEnabled = false;
      c.fillStyle = '#101014'; c.fillRect(0, 0, cw, chh);
      const z = Math.max(1, Math.floor(Math.min((cw - 8) / nx, (chh - 8) / ny))), ox = Math.floor((cw - nx * z) / 2), oy = Math.floor((chh - ny * z) / 2);
      for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) { const col = g[y][x]; c.fillStyle = col ? rgb(col) : (((x + y) & 1) ? '#222228' : '#1a1a20'); c.fillRect(ox + x * z, oy + y * z, z, z); }
    }
    function applyImport() {
      if (!impGrid) return;
      const g = cropEmpty(impGrid.map((r) => r.map((c) => (c ? c.slice() : null))));
      W = g[0].length; H = g.length;
      layerSeq = 1; layers = [{ name: 'Слой 1', grid: g, opacity: 1, visible: true }]; cur = 0;
      palette = paletteFromGrid(g); if (palette.length) active = palette[0];
      sym = $('imp-sym').checked; $('sym').classList.toggle('on', sym);
      undoStack.length = redoStack.length = 0; dirtyAll();
      refreshActive(); buildPalette(); setTool('pencil'); layList();
      $('imp-ovl').classList.remove('on'); fitView();
      toast(`Готово: ${W}×${H} — рисуй!`);
    }

    // ---- экспорт PNG (прозрачный фон, все видимые слои) ----
    function exportPng() {
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
      for (let i = 0; i < layers.length; i++) { const L = layers[i]; if (!L.visible || L.opacity <= 0) continue;
        x.globalAlpha = L.opacity; x.drawImage(layerCanvas(i), 0, 0); }
      saveCanvas(c, `pixel_${W}x${H}.png`);
    }
    function showSaveOverlay(u) { $('ovlimg').src = u; $('ovl').classList.add('on'); }
    function saveCanvas(c, name) { c.toBlob(async (b) => { const file = new File([b], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
      if (matchMedia('(pointer: coarse)').matches) { showSaveOverlay(c.toDataURL('image/png')); return; }
      const url = URL.createObjectURL(b), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }, 'image/png'); }

    // ---- проводка UI ----
    $('t-pencil').onclick = () => setTool('pencil'); $('t-eraser').onclick = () => setTool('eraser');
    $('t-pick').onclick = () => setTool('pick'); $('t-fill').onclick = () => setTool('fill');
    $('sym').onclick = () => { sym = !sym; $('sym').classList.toggle('on', sym); render(); toast(sym ? 'Симметрия включена' : 'Симметрия выключена'); };
    $('outline').onclick = outlineLayer;
    $('undo').onclick = doUndo; $('redo').onclick = doRedo;
    $('zin').onclick = () => zoomBy(1.25); $('zout').onclick = () => zoomBy(0.8); $('fit').onclick = fitView;
    $('imp').onclick = () => $('file').click();
    $('exp').onclick = exportPng;
    $('picker').onchange = (e) => addColor(e.target.value);
    $('ovlclose').onclick = () => $('ovl').classList.remove('on');

    const fileInp = document.createElement('input'); fileInp.type = 'file'; fileInp.accept = 'image/*'; fileInp.id = 'file';
    document.body.appendChild(fileInp);
    fileInp.onchange = (e) => { openImport(e.target.files[0]); e.target.value = ''; };

    ['imp-colors', 'imp-bgtol'].forEach((id) => { const el = $(id), out = $(id + 'v');
      el.addEventListener('input', () => { if (out) out.textContent = el.value; impSoon(); }); });
    $('imp-cell').addEventListener('input', () => { const v = +$('imp-cell').value; $('imp-cellv').textContent = v ? v : 'Авто'; impSoon(); });
    ['imp-clean', 'imp-sym'].forEach((id) => $(id).addEventListener('change', impConvert));
    $('imp-apply').onclick = applyImport;
    $('imp-cancel').onclick = () => $('imp-ovl').classList.remove('on');

    $('new').onclick = () => $('new-ovl').classList.add('on');
    document.querySelectorAll('#new-chips button').forEach((b) => b.addEventListener('click', () => {
      $('new-size').value = b.dataset.s;
      document.querySelectorAll('#new-chips button').forEach((x) => x.classList.toggle('on', x === b));
    }));
    $('new-create').onclick = () => {
      const s = parseInt($('new-size').value, 10);
      if (!s || s < 2 || s > 256) { toast('Размер от 2 до 256'); return; }
      snapshot(); W = H = s; layerSeq = 1; layers = [newLayer('Слой 1')]; cur = 0; dirtyAll();
      $('new-ovl').classList.remove('on'); layList(); fitView(); toast(`Холст ${s}×${s}`);
    };
    $('new-cancel').onclick = () => $('new-ovl').classList.remove('on');

    for (const id of ['ovl', 'imp-ovl', 'new-ovl']) $(id).addEventListener('click', (e) => { if (e.target.id === id) $(id).classList.remove('on'); });
    window.addEventListener('resize', fitView);

    refreshActive(); buildPalette(); layList();
    requestAnimationFrame(() => { fitView(); toast('Щипок — зум · тап 2 пальцами — отмена'); });
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
